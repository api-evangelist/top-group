aid: top-group
name: TOP Group (The Open Platform)
description: 'TOP Group (The Open Platform, top.co) is the tech company fueling the Telegram
  economy, connecting Telegram''s billion-user audience to the TON blockchain through in-house
  retail products and builder solutions. TOP operates two flagship companies: Wallet in Telegram
  (100M+ users) and TOP Labs, a venture builder behind 25+ Telegram/TON ecosystem projects
  including Tonkeeper (acquired 100% in January 2026), TON API, Getgems, STON.fi, Notcoin, and
  Tribute. Founded by Andrew Rogozov and backed by Ribbit Capital, TOP is the first unicorn in
  the TON-Telegram ecosystem, valued at $1 billion. Its developer surface centers on TON API
  (tonapi.io) - the indexed REST, streaming, and webhooks API to the TON blockchain - and the
  TON Console developer platform (tonconsole.com). Surfaced as a portfolio company of
  ribbit-capital and enriched by the API Evangelist pipeline.'
