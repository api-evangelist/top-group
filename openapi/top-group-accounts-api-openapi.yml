          type: boolean
          example: true
  parameters:
    currenciesQuery:
      in: query
      name: currencies
      description: accept gram and all possible fiat currencies, separated by commas
      required: false
      explode: false
      schema:
        type: array
        items:
          type: string
        example:
        - gram
        - usd
        - rub
    limitQuery:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        default: 1000
        maximum: 1000
        minimum: 1
    i18n:
      in: header
      name: Accept-Language
      required: false
      schema:
        type: string
        example: ru-RU,ru;q=0.5
        default: en
    initiatorQuery:
      in: query
      name: initiator
      description: Show only events that are initiated by this account
      explode: false
      schema:
        type: boolean
        default: false
    accountIDParameter:
      in: path
      name: account_id
      required: true
      description: account ID
      schema:
        type: string
        format: address
        example: 0:97264395BD65A255A429B11326C84128B7D70FFED7949ABAE3036D506BA38621
    offsetQuery:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    collectionQuery:
      in: query
      name: collection
      required: false
      description: nft collection
      schema:
        type: string
        format: address
        example: 0:06d811f426598591b32b2c49f29f66c821368e4acb1de16762b04e0174532465
    ecIDParameter:
      in: path
      name: id
      required: true
      description: extra currency id
      schema:
        type: integer
        example: 239
        format: int32
    currencyQuery:
      in: query
      name: currency
      required: false
      schema:
        type: string
        example: usd
    eventIDParameter:
      in: path
      name: event_id
      required: true
      description: event ID or transaction hash in hex (without 0x) or base64url format
      schema:
        type: string
        example: 97264395BD65A255A429B11326C84128B7D70FFED7949ABAE3036D506BA38621
    jettonIDParameter:
      in: path
      name: jetton_id
      required: true
      description: jetton ID
      schema:
        type: string
        format: address
        example: 0:97264395BD65A255A429B11326C84128B7D70FFED7949ABAE3036D506BA38621
    supportedExtensions:
      in: query
      name: supported_extensions
      description: comma separated list supported extensions
      explode: false
      required: false
      schema:
        type: array
        items:
          type: string
        example:
        - custom_payload
        - defi
    periodQuery:
      in: query
      name: period
      required: false
      description: number of days before expiration
      schema:
        type: integer
        minimum: 1
        maximum: 3660
  requestBodies:
    Boc:
      description: bag-of-cells serialized to hex
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - boc
            properties:
              boc:
                type: string
                format: cell
    AccountIDs:
      description: a list of account ids
      content:
        application/json:
          schema:
            type: object
            required:
            - account_ids
            properties:
              account_ids:
                type: array
                items:
                  type: string
                  format: address
                  example: 0:97264395BD65A255A429B11326C84128B7D70FFED7949ABAE3036D506BA38621
  responses:
    Error:
      description: Some error during request processing
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
              error_code:
                type: integer
                format: int64
              details:
                $ref: '#/components/schemas/InsufficientFunds'
