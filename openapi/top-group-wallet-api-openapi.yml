          $ref: '#/components/schemas/BouncePhaseType'
        aborted:
          type: boolean
          example: true
        destroyed:
          type: boolean
          example: true
        raw:
          type: string
          format: cell
          description: hex encoded boc with raw transaction
          example: 
    EncryptedComment:
      type: object
      required:
      - encryption_type
      - cipher_text
      properties:
        encryption_type:
          type: string
          example: simple
        cipher_text:
          type: string
          example: A6A0BD6608672B...CE3AF8DB
    ElectionsDepositStakeAction:
      type: object
      required:
      - amount
      - staker
      properties:
        amount:
          type: integer
          format: int64
          example: 1660050553
          x-js-format: bigint
        staker:
          $ref: '#/components/schemas/AccountAddress'
    TrustType:
      type: string
      example: whitelist
      enum:
      - whitelist
      - graylist
      - blacklist
      - none
  parameters:
    accountIDParameter:
      in: path
      name: account_id
      required: true
      description: account ID
      schema:
        type: string
        format: address
        example: 0:97264395BD65A255A429B11326C84128B7D70FFED7949ABAE3036D506BA38621
    i18n:
      in: header
      name: Accept-Language
      required: false
      schema:
        type: string
        example: ru-RU,ru;q=0.5
        default: en
    currencyQuery:
      in: query
      name: currency
      required: false
      schema:
        type: string
        example: usd
    publicKeyParameter:
      in: path
      name: public_key
      required: true
      schema:
        type: string
        example: NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE2ODQ3...
  responses:
    Error:
      description: Some error during request processing
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties:
              error:
                type: string
              error_code:
                type: integer
                format: int64
              details:
                $ref: '#/components/schemas/InsufficientFunds'
  requestBodies:
    TonConnectProof:
      description: Data that is expected from TON Connect
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - address
            - proof
            properties:
              address:
                type: string
                format: address
                example: 0:97146a46acc2654y27947f14c4a4b14273e954f78bc017790b41208b0043200b
              proof:
                type: object
                required:
                - timestamp
                - domain
                - signature
                - payload
                properties:
                  timestamp:
                    type: integer
                    format: int64
                    example: '1678275313'
                  domain:
                    type: object
                    required:
                    - value
                    properties:
                      length_bytes:
                        type: integer
                        format: int32
                      value:
                        type: string
                  signature:
                    type: string
                  payload:
                    type: string
                    example: 84jHVNLQmZsAAAAAZB0Zryi2wqVJI-KaKNXOvCijEi46YyYzkaSHyJrMPBMOkVZa
                  state_init:
                    type: string
                    format: cell-base64
    EmulationBoc:
      description: bag-of-cells serialized to base64/hex and additional parameters to configure emulation
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - boc
            properties:
              boc:
                type: string
                format: cell
              address_override:
                type: string
                format: address
                description: Override the destination wallet address extracted from the BoC. Useful when the BoC was signed with a throwaway key and the real wallet address must be emulated against.
                example: 0:97146a46acc2654y27947f14c4a4b14273e954f78bc017790b41208b0043200b
              params:
                type: array
                description: additional per account configuration
                items:
                  type: object
                  required:
                  - address
                  properties:
                    address:
                      type: string
                      format: address
                      example: 0:97146a46acc2654y27947f14c4a4b14273e954f78bc017790b41208b0043200b
                    balance:
                      type: integer
                      format: int64
                      example: 10000000000
                      x-js-format: bigint
    PublicKeys:
      description: a list of hex-encoded ed25519 public keys
      content:
        application/json:
          schema:
            type: object
            required:
            - public_keys
            properties:
              public_keys:
                type: array
                items:
                  type: string
                  example: d8519b83d5b04b17a706ef6d04f3566422be47c2b676b0823235d67b1ef4b1b2
